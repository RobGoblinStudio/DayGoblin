[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[[edge_functions]]
function = "calendar-meta"
path = "/:room"

[[redirects]]
  from = "/skapa"
  to = "/create.html"
  status = 200

[[redirects]]
  from = "/:room"
  to = "/calendar.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
