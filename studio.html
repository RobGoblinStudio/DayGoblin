<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#bdbdbd" />
  <meta name="description" content="RobGoblin Studio — enkla verktyg för att planera tillsammans och samla produkter från webbshoppar." />
  <title>RobGoblin Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light; --paper:#bdbdbd; --ink:#111; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { min-height:100vh; min-height:100svh; display:flex; flex-direction:column; margin:0; background:var(--paper); color:var(--ink); font-family:"Courier New",Courier,monospace; }
    main { width:min(100%,1440px); flex:1; margin:0 auto; padding:clamp(28px,7vw,100px); display:flex; flex-direction:column; justify-content:center; }
    .language-switch { align-self:flex-end; display:flex; gap:.25rem; margin-bottom:clamp(2rem,5vh,4rem); }
    .language-switch button { border:1px solid var(--ink); background:transparent; color:var(--ink); font:700 1rem/1 "Courier New",Courier,monospace; padding:.65rem .75rem; cursor:pointer; }
    .language-switch button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
    .language-switch button:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
    .studio-footer { padding:24px clamp(28px,7vw,100px); font-size:.8rem; color:#333; }
    h1 { margin:0; font-size:clamp(3rem,15vw,12rem); font-weight:700; line-height:.95; letter-spacing:-.085em; }
    ul { margin:clamp(64px,10vh,120px) 0 0; padding:0; list-style:none; }
    li + li { margin-top:2.5rem; }
    li p { max-width:36rem; margin:.6rem 0 0; font-size:clamp(1rem,1.2vw,1.15rem); line-height:1.55; }
    a { color:var(--ink); font-size:clamp(1.25rem,2.1vw,1.75rem); text-decoration:none; }
    li a { text-decoration:underline; text-underline-offset:.18em; text-decoration-thickness:1px; }
    li a::before { content:">"; display:inline-block; margin-right:.65em; text-decoration:none; }
    a:hover { text-decoration-thickness:2px; }
    a:focus-visible { outline:2px solid var(--ink); outline-offset:5px; }
  </style>
</head>
<body>
  <main>
    <div class="language-switch" role="group" aria-label="Språk / Language">
      <button type="button" data-language="sv" aria-pressed="true" lang="sv">SV</button>
      <button type="button" data-language="en" aria-pressed="false" lang="en">EN</button>
    </div>
    <h1>HEJ KINA!</h1>
    <ul aria-label="Projekt">
      <li>
        <a href="https://daygoblin.robgoblin.studio">DayGoblin</a>
        <p id="day-description">Hitta en dag som passar alla. Skapa en kalender, dela länken och se när ni kan ses.</p>
      </li>
      <li>
        <a href="https://buygoblin.robgoblin.studio">BuyGoblin</a>
        <p id="buy-description">Samla produkter från olika webbshoppar på en lista, så hittar du enkelt tillbaka till dem innan du beställer.</p>
      </li>
    </ul>
  </main>
  <footer class="studio-footer">© 2026 RobGoblin Studio</footer>
  <script>
    (() => {
      const translations = {
        sv: { greeting: 'HEJ KINA!', day: 'Hitta en dag som passar alla. Skapa en kalender, dela länken och se när ni kan ses.', buy: 'Samla produkter från olika webbshoppar på en lista, så hittar du enkelt tillbaka till dem innan du beställer.', projects: 'Projekt', description: 'RobGoblin Studio — enkla verktyg för att planera tillsammans och samla produkter från webbshoppar.' },
        en: { greeting: 'HI KINA!', day: 'Find a day that works for everyone. Create a calendar, share the link and see when you can meet.', buy: 'Keep products from different online shops in one list, so you can easily find them again when you’re ready to order.', projects: 'Projects', description: 'RobGoblin Studio — simple tools for making plans together and collecting products from online shops.' }
      };
      const buttons = document.querySelectorAll('[data-language]');
      const setLanguage = language => {
        const copy = translations[language];
        document.documentElement.lang = language;
        document.querySelector('h1').textContent = copy.greeting;
        document.getElementById('day-description').textContent = copy.day;
        document.getElementById('buy-description').textContent = copy.buy;
        document.querySelector('ul').setAttribute('aria-label', copy.projects);
        document.querySelector('meta[name="description"]').content = copy.description;
        buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.language === language)));
        document.querySelectorAll('li a').forEach(link => { const url = new URL(link.href); url.searchParams.set('lang', language); link.href = url.href; });
        try { localStorage.setItem('robgoblin-language', language); } catch {}
      };
      buttons.forEach(button => button.addEventListener('click', () => setLanguage(button.dataset.language)));
      let saved;
      try { saved = localStorage.getItem('robgoblin-language'); } catch {}
      setLanguage(saved === 'en' ? 'en' : 'sv');
    })();
  </script>
</body>
</html>
