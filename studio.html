<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#bdbdbd" />
  <meta name="description" content="RobGoblin Studio — enkla verktyg för att planera tillsammans och samla produkter från webbshoppar." />
  <title>RobGoblin Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light; --paper:#bdbdbd; --ink:#111; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { min-height:100vh; min-height:100svh; margin:0; background:var(--paper); color:var(--ink); font-family:"Courier New",Courier,monospace; }
    main { width:min(100%,1440px); min-height:100vh; min-height:100svh; margin:0 auto; padding:clamp(28px,7vw,100px); display:flex; flex-direction:column; justify-content:center; }
    h1 { margin:0; font-size:clamp(3rem,15vw,12rem); font-weight:700; line-height:.95; letter-spacing:-.085em; }
    ul { margin:clamp(64px,10vh,120px) 0 0; padding:0; list-style:none; }
    li + li { margin-top:2.5rem; }
    li p { max-width:36rem; margin:.6rem 0 0; font-size:clamp(1rem,1.2vw,1.15rem); line-height:1.55; }
    a { color:var(--ink); font-size:clamp(1.25rem,2.1vw,1.75rem); text-decoration:none; }
    a:hover { text-decoration:underline; text-underline-offset:.18em; }
    a:focus-visible { outline:2px solid var(--ink); outline-offset:5px; }
  </style>
</head>
<body>
  <main>
    <h1>HEJ KINA!</h1>
    <ul aria-label="Projekt">
      <li>
        <a href="https://daygoblin.robgoblin.studio">DayGoblin</a>
        <p>Hitta en dag som passar alla. Skapa en kalender, dela länken och se när ni kan ses.</p>
      </li>
      <li>
        <a href="https://buygoblin.robgoblin.studio">BuyGoblin</a>
        <p>Samla produkter från olika webbshoppar på en lista, så hittar du enkelt tillbaka till dem innan du beställer.</p>
      </li>
    </ul>
  </main>
</body>
</html>
