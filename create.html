<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f7f7" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Skapa kalender — DayGoblin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=27" />
</head>
<body class="home-page create-page">
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/" data-language-link aria-label="DayGoblin startsida" data-i18n-aria="homeAria"><span class="brand-mark material-symbols-rounded" aria-hidden="true">calendar_month</span> DayGoblin</a>
      <div class="locale-switch" role="group" aria-label="Språk" data-i18n-aria="languageLabel"><button type="button" data-language="sv" aria-pressed="true">SV</button><button type="button" data-language="en" aria-pressed="false">EN</button></div>
    </header>
    <section class="intro home-intro">
      <h1><span data-i18n="createHeadline">Skapa er</span><br><em data-i18n="createHeadlineAccent">egen kalender.</em></h1>
      <p class="intro-copy" data-i18n="createIntro">Döp kalendern och ange hur många som ska vara med.</p>
    </section>

    <form class="create-card" id="createForm" novalidate>
      <label class="create-label" for="purposeInput" data-i18n="calendarName">Döp kalender</label>
      <div class="purpose-input-wrap" data-prefix="Till exempel:">
        <span class="purpose-example" id="purposeExample" aria-hidden="true">Repa med bandet</span>
        <input class="purpose-input" id="purposeInput" name="purpose" maxlength="100" placeholder="" required />
      </div>

      <div class="group-settings">
        <div class="count-field-wrap">
          <label class="create-label" for="participantCountInput" data-i18n="participantCount">Hur många ska vara med?</label>
          <input class="count-input" id="participantCountInput" name="participantCount" type="number" min="2" max="10" step="1" inputmode="numeric" pattern="[0-9]*" value="4" />
        </div>
        <label class="open-option" for="openAudience">
          <input type="checkbox" id="openAudience" name="openAudience" />
          <span class="open-copy"><b data-i18n="openCount">Öppet antal</b><small data-i18n="openCountHint">Visa vilka dagar som får flest röster</small></span>
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>

      <button class="create-button" id="createButton" type="submit"><span data-i18n="createButton">Skapa kalender</span><span class="action-icon material-symbols-rounded" aria-hidden="true">add_circle</span></button>
      <p class="create-note" data-i18n="createNote">Du får en egen länk att dela med gruppen.</p>
      <p class="form-error" id="formError" role="alert"></p>
    </form>
    <footer class="app-footer">DayGoblin <span class="footer-mark material-symbols-rounded" aria-hidden="true">calendar_month</span> <small>v1.0.6</small></footer>
    <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script><script type='text/javascript'>kofiwidget2.init('Support me', '#00b9fe', 'J7N52B1KSE');kofiwidget2.draw();</script>
  </main>
  <script type="module" src="i18n.js?v=2"></script>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="home.js?v=14"></script>
</body>
</html>
